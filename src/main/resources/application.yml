logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [requestId=%X{requestId}] [conversationId=%X{conversationId}] [turnId=%X{turnId}] - %msg%n"
  level:
    com.tanwar.market_pilot: INFO

llm:
  provider: ${LLM_PROVIDER:gemini}

  retry:
    max-attempts: 3
    initial-backoff-ms: 1000
    max-backoff-ms: 10000
    jitter-factor: 0.5

  timeout:
    duration-ms: 300000

  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state-ms: 30000
    permitted-calls-in-half-open-state: 2

  providers:
    gemini:
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      api-key: ${GEMINI_API_KEY:}
      base-url: https://generativelanguage.googleapis.com
    openai:
      model: fake-openai-model
    fake:
      model: fake-model
    ollama:
      model: ${OLLAMA_MODEL:qwen3:4b}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/market_pilot
    username: market_pilot
    password: market_pilot
    driver-class-name: org.postgresql.Driver
  mvc:
    async:
      request-timeout: 120000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
market-data:
  provider: ${MARKET_DATA_PROVIDER:fake}
  api-key: ${ALPHA_VANTAGE_API_KEY}
  base-url: https://www.alphavantage.co
  rate-limit:
    min-interval-ms: 1100